name: secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan tracked files for secrets, real IPs and internal hostnames
        run: python3 scripts/scan_secrets.py
      - name: Byte-compile the server
        run: python3 -m compileall -q server.py mock_ollama.py scripts/scan_secrets.py
